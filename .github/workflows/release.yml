name: Release

# Publishing is tag-driven so the released bytes are a named, immutable commit rather
# than whatever main happened to be when someone clicked a button. The tag is the
# request; every gate below is a veto.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Minimal and explicit at the workflow level; the publish job widens `id-token` only
# for itself, because that token is what mints the npm provenance attestation and no
# other job in this file has any business holding it.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `check` is lint + typecheck + build + test. `test:pack` proves the tarball.
      # The separate compatibility job proves the built plugin against the exact Harness pin.
      - name: Full check
        run: pnpm run check

      - name: Pack once and test the release tarball
        env:
          RAVEN_PACK_OUTPUT: ${{ github.workspace }}/.release/raven.tgz
        run: |
          pnpm run test:pack
          cd .release
          sha256sum raven.tgz > raven.tgz.sha256

      - name: Preserve the tested release tarball
        uses: actions/upload-artifact@v7
        with:
          name: raven-release-tarball
          path: .release/
          if-no-files-found: error

      # A tag that does not name the version being published produces a release whose
      # git tag and npm version disagree forever, and nothing downstream can repair it.
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # The compatibility job checks the pin against a real exact checkout. This early
      # shape check keeps a malformed ref from reaching actions/checkout with a vague error.
      - name: Release tag belongs to main history
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release tag must point to a commit already reachable from origin/main"
            exit 1
          fi

      - name: Harness pin is present and well-formed
        run: |
          node -e '
            const m = require("./package.json").dshRaven ?? {};
            const version = m.harnessVersion, commit = m.harnessCommit;
            if (typeof version !== "string" || version.length === 0) {
              console.error("::error::package.json dshRaven.harnessVersion is missing; a release must state the Harness it was tested against");
              process.exit(1);
            }
            if (typeof commit !== "string" || !/^[a-f0-9]{40}$/.test(commit)) {
              console.error("::error::package.json dshRaven.harnessCommit must be a full 40-character commit sha, got " + String(commit));
              process.exit(1);
            }
            console.log("harness pin: " + version + "@" + commit.slice(0, 12));
          '

      # A tree that installs or builds dirty is a tree whose published bytes are not the
      # ones in the tag. `pnpm install --frozen-lockfile` above would already have failed
      # on a stale lockfile; this catches a build or a lifecycle script that WRITES into
      # the working tree, which frozen-lockfile does not see.
      - name: Working tree is clean after the gate
        run: |
          if [ -n "$(git status --porcelain=v1)" ]; then
            echo "::error::the release gate left the working tree dirty; the published bytes would not match the tag"
            git status --porcelain=v1
            exit 1
          fi

  compatibility:
    name: pinned Harness compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: harness-pin
        name: Read exact Harness pin
        shell: bash
        run: |
          echo "commit=$(node -p \"require('./package.json').dshRaven.harnessCommit\")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p \"require('./package.json').dshRaven.harnessVersion\")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.harness-pin.outputs.commit }}
          path: .harness-under-test

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install pinned Harness workspace
        run: pnpm --dir .harness-under-test install --frozen-lockfile

      - name: Exercise Raven against the exact pin
        run: pnpm run test:dsh
        env:
          DSH_CHECKOUT: ${{ github.workspace }}/.harness-under-test

      - name: Smoke paired presets and process resume
        run: >-
          pnpm run eval -- run
          --scenario steering-checkpoint
          --fixture-model
          --checkout "${{ github.workspace }}/.harness-under-test"
          --out .tmp/evaluation/release-runner-smoke

  publish:
    name: publish to npm
    needs: [gate, compatibility]
    # Manual dispatch exercises the gates only. Publishing is possible exclusively from
    # an immutable v* tag push whose version check passed above.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      # Provenance: npm records WHICH workflow at WHICH commit produced the tarball, so
      # a consumer can verify the published bytes came from this repository rather than
      # from someone's laptop. It requires an OIDC token, which is why this scope exists
      # here and nowhere else in the file.
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Download the exact tested tarball
        uses: actions/download-artifact@v7
        with:
          name: raven-release-tarball
          path: .release

      - name: Verify and publish the tested bytes with provenance
        run: |
          cd .release
          sha256sum --check raven.tgz.sha256
          npm publish raven.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
