# Mount Raven's AGENT half in ONE agent preset, by hand.
#
# This row is for a deployment that wants Raven inside a preset it already
# maintains, rather than as its own selectable mode. Append it to a copied,
# user-authored preset; do not edit a shipped DeepSeek Harness preset.
#
# For the ordinary case — Raven as its own mode — run `dsh-raven-install-preset`
# instead. That builds `$DSH_HOME/.agent-presets/raven` from your deployment's
# own base preset and appends exactly this row. It is also why this package
# ships no composition of its own: a preset's `agent.cordis.yml` is the WHOLE
# agent — persona, tools, shell — so a copy of one inside an npm package would
# drift silently from the original.
#
# `role: agent` registers `raven_task`, the system-prompt section, the pre-step
# Task context, and the `tools/code-dispatch-log` waterfall — and deliberately
# NOT the settings namespace.
#
# That omission IS the isolation, not an oversight. A settings namespace is
# served process-wide and the settings page is global, so registering it would
# put a Raven card in front of a user working in any other mode. Configure Raven
# here instead, in the `config:` block below, next to the mount it configures.
#
# The settings card remains available to a deployment that wants it and accepts
# losing that isolation: apply this package's shipped `cordis.patch.yml` as an
# overlay. `dsh plugin add` no longer does it for you, because the manifest
# declares no bundle.
#
# The Harness mounts one standing plugin instance per preset and every session
# using that preset joins its scope. Raven therefore keys all mutable state by
# Agent or Team identity inside that shared instance.
- id: raven-research
  name: dsh-raven-research
  config:
    role: agent
    # Optional. These entries are the base layer of the `raven-research` settings
    # namespace for this scope; a value stored in the user's settings.yaml overrides
    # them while a settings provider is composed, and they become authoritative
    # again if that provider goes away.
    # Contextual capability hints: auto | off.
    # guidance: auto
    # sourceVerification: remote
    sourceNetworkPolicy: public-only
    sourceCheckTimeoutMs: 20000
    # sourceDiscovery: seam
    # searchMaxQueries: 4
    # searchMaxResults: 8
    # searchTimeoutMs: 30000
    # # Writing: one sentence per line makes a LINE the smallest edit unit.
    # proseLayout: sentence-per-line
    # proseFormat: markdown
    # # Draft Variants stay off until a deployment names the routes they may spend.
    # draftRoutes: []
    # draftMaxTokens: 4000
    # draftTimeoutMs: 120000
