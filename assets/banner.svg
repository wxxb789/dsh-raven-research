<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 336" width="880" height="336" role="img" aria-label="dsh-raven-research: one progressive, source-grounded Task for research, writing, and learning in DeepSeek Harness">
  <title>dsh-raven-research</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c6ef5" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#a371f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="878" height="334" rx="16" fill="url(#card)" stroke="url(#edge)" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <rect x="2" y="2" width="876" height="44" rx="15" fill="#161b22"/>
    <rect x="2" y="30" width="876" height="16" fill="#161b22"/>
    <circle cx="28" cy="24" r="6" fill="#ff5f57"/>
    <circle cx="50" cy="24" r="6" fill="#febc2e"/>
    <circle cx="72" cy="24" r="6" fill="#28c840"/>
    <text x="440" y="29" text-anchor="middle" font-size="13" fill="#7d8590">dsh-raven-research &#183; a DeepSeek Harness plugin</text>
    <line x1="2" y1="46" x2="878" y2="46" stroke="#30363d" stroke-width="1"/>

    <text x="32" y="86" font-size="14" fill="#7d8590">you</text>
    <text x="92" y="86" font-size="14" fill="#c9d1d9">&#8220;research the case for and against X, show me an early outline&#8221;</text>

    <text x="32" y="130" font-size="15" fill="#58a6ff">&#9656;</text>
    <text x="60" y="130" font-size="14" fill="#e6edf3">start</text>
    <text x="230" y="130" font-size="14" fill="#7d8590">outcome=research &#183; grounding=required</text>

    <text x="32" y="164" font-size="15" fill="#3fb950">&#10003;</text>
    <text x="60" y="164" font-size="14" fill="#e6edf3">checkpoint</text>
    <text x="230" y="164" font-size="14" fill="#7d8590">early findings outline &#8212; useful right now</text>

    <text x="32" y="198" font-size="15" fill="#d29922">&#8635;</text>
    <text x="60" y="198" font-size="14" fill="#e6edf3">steer</text>
    <text x="230" y="198" font-size="14" fill="#7d8590">&#8220;focus on cost, not adoption&#8221; &#8212; same Task</text>

    <text x="32" y="232" font-size="15" fill="#3fb950">&#10003;</text>
    <text x="60" y="232" font-size="14" fill="#e6edf3">checkpoint</text>
    <text x="230" y="232" font-size="14" fill="#7d8590">decision memo &#183; sources re-opened</text>

    <text x="32" y="266" font-size="15" fill="#3fb950">&#10003;</text>
    <text x="60" y="266" font-size="14" fill="#e6edf3">complete</text>
    <text x="230" y="266" font-size="14" fill="#7d8590">every citation matched against fetched bytes</text>

    <text x="32" y="300" font-size="15" fill="#a371f7">&#8681;</text>
    <text x="60" y="300" font-size="14" fill="#e6edf3">export</text>
    <text x="230" y="300" font-size="14" fill="#7d8590">wiki/queries &#183; wiki/raw &#183; wiki/log.md</text>
  </g>
</svg>
